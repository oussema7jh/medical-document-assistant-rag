[project]
name = "medical-document-assistant-rag"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pypdf==7.1.1",
  "fonttools==4.68.0",
  "sentence-transformers==5.7.0",
  "chromadb==1.5.9",
  "pydantic==2.14.4",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_assistant"]

[tool.ruff]
line-length = 100
